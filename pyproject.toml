[project]
name = "vouch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ojas", email = "OjasD025@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "androguard>=4.1.4",
    "cachetools>=7.2.1",
    "disarm>=0.17.2",
    "fastapi>=0.142.0",
    "greenlet>=3.5.6",
    "httpx>=0.28",
    "langchain>=1.4.5",
    "langchain-litellm>=0.11.1",
    "langchain-ollama>=1.1.0",
    "logging>=0.4.9.6",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-instrumentation-asyncio==0.66b1",
    "opentelemetry-instrumentation-click==0.66b1",
    "opentelemetry-instrumentation-dbapi==0.66b1",
    "opentelemetry-instrumentation-exceptions==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-grpc==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-instrumentation-psycopg==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-sqlite3==0.66b1",
    "opentelemetry-instrumentation-starlette==0.66b1",
    "opentelemetry-instrumentation-system-metrics==0.66b1",
    "opentelemetry-instrumentation-threading==0.66b1",
    "opentelemetry-instrumentation-tortoiseorm==0.66b1",
    "opentelemetry-instrumentation-urllib==0.66b1",
    "opentelemetry-instrumentation-urllib3==0.66b1",
    "opentelemetry-instrumentation-wsgi==0.66b1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyroscope-io>=1.3.0",
    "pyroscope-otel>=1.1.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
vouch = "vouch:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[uv.tools]
package = false
