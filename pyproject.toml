[project]
name = "vouch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ojas", email = "OjasD025@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.0",
    "logging>=0.4.9.6",
    "psycopg>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
vouch = "vouch:main"

[dependency-groups]
dev = [
    "greenlet>=3.0",
    "httpx>=0.28",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[uv.tools]
package = false
