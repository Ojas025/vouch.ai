services:
  redis:
    image: docker.io/library/redis:7
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    restart: unless-stopped

  database:
    image: "docker.io/library/postgres:latest"
    ports:
      - 5432:5432
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: vouch
    volumes:
      - pgdata:/var/lib/postgresql/

volumes:
  redis-data:
    driver: local
  pgdata:
    driver: local
