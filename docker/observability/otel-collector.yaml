receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # limit_mib is required: the memory_limiter refuses to start without a limit.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}

exporters:
  # "otlp" is a deprecated alias; the explicit gRPC exporter is otlp_grpc.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus scrapes this; Prometheus 3 can also ingest OTLP natively via
  # --web.enable-otlp-receiver if the scrape hop is ever dropped.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Loki is deferred; logs land here for now and this is the seam it will replace.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    metrics:
      readers:
        # Default host is localhost, which Prometheus cannot reach across containers.
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
