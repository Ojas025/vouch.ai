global:
  scrape_interval: 15s

scrape_configs:
  # Application metrics arrive over OTLP at the collector, which re-exposes them
  # in Prometheus format here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own pipeline telemetry: dropped spans, queue depth, refusals.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
