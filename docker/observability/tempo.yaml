# Monolithic single-binary Tempo: the collector exports traces to the OTLP
# receiver below. metrics_generator is intentionally absent until Prometheus
# remote-write is wired up.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # The receiver binds localhost by default, so the endpoint must be explicit.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
