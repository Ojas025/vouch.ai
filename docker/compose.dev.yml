# Development override: docker compose -f docker/docker-compose.yml -f docker/compose.dev.yml up
#
# Runs the api out of the development image with the source bind-mounted, so
# uvicorn --reload picks up edits without a rebuild.
services:
  api:
    build:
      target: development
    image: vouch-app:development
    # The host uid must own the bind-mounted tree and the generated bytecode.
    user: "${VOUCH_DEV_UID:-1000}:${VOUCH_DEV_GID:-1000}"
    volumes:
      - ../src:/app/src
      - ../alembic:/app/alembic
      # Shadows the editable install's downloads dir so media never lands in the
      # host source tree.
      - vouch-dev-downloads:/app/src/vouch/downloads
    environment:
      VOUCH_LOG_DIR: /tmp/logs

volumes:
  vouch-dev-downloads:
